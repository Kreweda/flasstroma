
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111d">
  <title>FlashStroma — Składy</title>
  <style>
    *{box-sizing:border-box} :root{--bg:#eceff3;--card:#fff;--text:#111827;--muted:#69727d;--line:#dfe3e8;--soft:#f6f7f9;--accent:#ff0046;--nav:#07111d}
    body.dark{--bg:#0f172a;--card:#172033;--text:#e5e7eb;--muted:#a8b3c3;--line:#2c3a50;--soft:#111827}
    body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif}
    .topbar{position:sticky;top:0;z-index:10;background:var(--nav);box-shadow:0 2px 12px #0004;color:#fff}
    .topbar-inner{width:min(1180px,calc(100% - 24px));min-height:58px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900}.logo-mark{width:32px;height:32px;border-radius:50%;background:conic-gradient(#ff0046,#ff6b8a,#ff0046);box-shadow:inset 0 0 0 5px #fff3}
    .nav{display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap}.nav a{display:block;padding:20px 11px 17px;border-bottom:3px solid transparent;color:#c5ced8;text-decoration:none;font-size:13px;font-weight:700}.nav a.active{color:#fff;border-color:var(--accent)}
    .theme-toggle{min-width:42px;height:34px;margin-left:8px;border:1px solid #fff4;border-radius:999px;background:#fff1;color:#fff;cursor:pointer;font-weight:900}
    main{width:min(860px,calc(100% - 24px));margin:14px auto 34px;display:grid;gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:0 8px 26px #0f172a14}
    .club-hero{padding:20px;color:#fff;background:linear-gradient(135deg,#07111d,#243244)}.club-hero small{display:block;color:#cbd5e1;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.club-identity{display:flex;align-items:center;gap:14px;margin-top:10px}.crest{width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:#fff;color:#07111d;font-size:26px;box-shadow:0 4px 16px #0004}.club-identity h1{margin:0;font-size:27px}.club-identity p{margin:4px 0 0;color:#cbd5e1;font-weight:700}
    .club-selector{padding:12px;border-bottom:1px solid var(--line);background:var(--soft)}.club-selector label{display:block;margin:0 0 8px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.club-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.club-button{flex:0 0 auto;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer;font:inherit;font-weight:900}.club-button.active{border-color:var(--accent);background:var(--accent);color:#fff}
    .squad-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}.squad-head h2{margin:0;font-size:14px;text-transform:uppercase}.squad-count{padding:4px 8px;border-radius:999px;background:#ffe5ec;color:#cf0039;font-size:11px;font-weight:900}body.dark .squad-count{background:#3b1020;color:#ff87a8}
    .position-title{margin:0;padding:14px 16px 8px;background:var(--card);font-size:16px}.players{padding:0 12px 12px}.player{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px;border-top:1px solid var(--line)}.avatar{width:42px;height:42px;flex:0 0 auto;border:2px solid var(--card);border-radius:50%;object-fit:cover;background:#dfe3e8;box-shadow:0 1px 5px #0003}.player-info{min-width:0;flex:1}.player-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}.player-role{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:700}.number{min-width:30px;text-align:center;color:var(--muted);font-size:17px;font-weight:900}.star{border:0;background:transparent;color:#adb5be;cursor:pointer;font-size:25px;line-height:1}.star.favorite{color:#ffc400}
    .team-photo{position:relative;margin:12px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#07111d}.team-photo img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#07111d;opacity:.9}.photo-caption{position:absolute;right:0;bottom:0;left:0;padding:13px 15px;color:#fff;background:linear-gradient(transparent,#07111deb);font-weight:900}.photo-caption span{display:block;margin-top:3px;color:#dbe4ef;font-size:12px;font-weight:700}
    .hint{padding:12px 16px;color:var(--muted);font-size:12px;line-height:1.45}.empty{padding:30px;color:var(--muted);text-align:center;font-weight:700}
    @media(max-width:650px){.topbar-inner{width:100%;align-items:stretch;flex-direction:column;gap:0;padding-top:10px}.logo{padding:0 12px}.nav{padding:0 6px}.nav a{padding-top:13px}.theme-toggle{align-self:center}.club-hero{padding:16px}.club-identity h1{font-size:23px}main{width:calc(100% - 14px);margin-top:7px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="logo"><span class="logo-mark"></span><span>Flashscore</span></div>
    <nav class="nav" aria-label="Główna nawigacja"><a href="index.html">Wyniki</a><a href="wiadomosci.html">Wiadomości</a><a href="wyniki.html">Wyniki Zawodów</a><a href="zawodnicy.html">Statystyki indywidualne</a><a class="active" href="sklad.html">Składy</a><a href="transfery.html">Transfery</a><button id="themeToggle" class="theme-toggle" type="button" title="Zmień motyw">☾</button></nav>
  </div></header>
  <main>
    <section class="card club-hero"><small>Świat: Liga Stromej · Składy</small><div class="club-identity"><div id="crest" class="crest">⚽</div><div><h1 id="clubName">Klub Jugosławianka</h1><p id="clubSubtitle">Kadra zespołu</p></div></div></section>
    <section class="card"><div class="club-selector"><label>Wybierz klub</label><div id="clubTabs" class="club-tabs"></div></div><div class="squad-head"><h2>Skład zespołu</h2><span id="squadCount" class="squad-count"></span></div><div id="teamPhoto"></div><div id="squad"></div><p class="hint">Kliknij ☆, aby oznaczyć zawodnika jako ulubionego. Dane można później łatwo zmienić w obiekcie <strong>clubs</strong> na dole pliku.</p></section>
  </main>
  <script>
    const clubs = {
      jugoslawianka:{name:'Klub Jugosławianka',subtitle:'Kadra zespołu',crest:'🛡️',players:[{name:'Kreweda',role:'Bramkarz',number:25,photo:'kredken.png'},{name:'Vienna',role:'Napastnik',number:7,photo:'viena.jpeg'}]},
      stromianka:{name:'Stromianka FC',subtitle:'Kadra zespołu',crest:'⚡',players:[{name:'Luśken',role:'Bramkarz',number:1,photo:'luske.png'},{name:'Pero',role:'Napastnik',number:9,photo:'pero.jpeg'}]},
      lammers:{name:'FS Lammers',subtitle:'Kadra zespołu',crest:'🔥',players:[{name:'Serduszkowata',role:'Bramkarz',number:1,photo:'ola.jpeg'},{name:'Koteu',role:'Napastnik',number:19,photo:'https://kreweda.github.io/flasstroma/116.jpg'}]},
      reprezentacja:{name:'Reprezentacja ul. Stromej',subtitle:'Kadra reprezentacji',crest:'🇵🇱',teamPhoto:'rep.jpeg',players:[{name:'Vienna',role:'Napastnik',number:7,photo:'viena.jpeg'},{name:'Pero',role:'Bramkarz',number:1,photo:'pero.jpeg'},{name:'Kreweda',role:'Pomocnik',number:4,photo:'kredken.png'}]}
    };
    const labels={jugoslawianka:'Jugosławianka FC',stromianka:'Stromianka FC',lammers:'FS Lammers',reprezentacja:'Reprezentacja ulicy Stromej'};
    const roleOrder=['Bramkarz','Obrońca','Pomocnik','Napastnik']; let selected='jugoslawianka'; const favoriteKey='flasstromaFavorites';
    const getFavorites=()=>new Set(JSON.parse(localStorage.getItem(favoriteKey)||'[]'));
    function render(){const club=clubs[selected],favorites=getFavorites();document.getElementById('clubName').textContent=club.name;document.getElementById('clubSubtitle').textContent=club.subtitle;document.getElementById('crest').textContent=club.crest;document.getElementById('squadCount').textContent=club.players.length+' zawodników';document.getElementById('clubTabs').innerHTML=Object.entries(labels).map(([key,label])=>`<button class="club-button ${key===selected?'active':''}" data-club="${key}">${label}</button>`).join('');document.getElementById('teamPhoto').innerHTML=club.teamPhoto?`<section class="team-photo"><img src="${club.teamPhoto}" alt="Zdjęcie grupowe: ${club.name}"><div class="photo-caption">Zdjęcie grupowe reprezentacji<span>Reprezentacja ul. Stromej</span></div></section>`:'';document.getElementById('squad').innerHTML=roleOrder.map(role=>{const players=club.players.filter(player=>player.role===role);if(!players.length)return '';return `<section><h3 class="position-title">${role==='Bramkarz'?'Bramkarze':role==='Pomocnik'?'Pomocnicy':role==='Napastnik'?'Napastnicy':'Obrońcy'}</h3><div class="players">${players.map(player=>{const id=selected+'-'+player.number;return `<article class="player"><img class="avatar" src="${player.photo}" alt="${player.name}"><span class="player-info"><span class="player-name">${player.name}</span><span class="player-role">${player.role}</span></span><span class="number">${player.number}</span><button class="star ${favorites.has(id)?'favorite':''}" data-favorite="${id}" aria-label="Ulubiony zawodnik">${favorites.has(id)?'★':'☆'}</button></article>`}).join('')}</div></section>`}).join('')||'<p class="empty">Brak zawodników w składzie.</p>';}
    document.addEventListener('click',event=>{const clubButton=event.target.closest('[data-club]');if(clubButton){selected=clubButton.dataset.club;render()}const star=event.target.closest('[data-favorite]');if(star){const favorites=getFavorites(),id=star.dataset.favorite;favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem(favoriteKey,JSON.stringify([...favorites]));render()}});
    const themeToggle=document.getElementById('themeToggle');function applyTheme(theme){document.body.classList.toggle('dark',theme==='dark');themeToggle.textContent=theme==='dark'?'☀':'☾';localStorage.setItem('flasstromaTheme',theme)}themeToggle.addEventListener('click',()=>applyTheme(document.body.classList.contains('dark')?'light':'dark'));applyTheme(localStorage.getItem('flasstromaTheme')||'light');render();
  </script>
</body>
</html>
